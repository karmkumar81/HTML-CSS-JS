<!DOCTYPE html>
<html>

<head>

    <title>Faculty Feedback</title>


    <style>


        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f8fc;
            margin: 0;
            padding: 0;
            color: #333;
        }



        header {

            background-color: #0b3d91;
            color: white;
            padding: 20px;
            text-align: center;

        }




        header h1 {

            margin: 0;
            font-size: 35px;

        }




        header h3 {

            margin-top: 10px;
            font-weight: normal;

        }




        .container {

            width: 85%;
            margin: auto;

        }





        .menu {

            background-color: white;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0px 2px 8px #ccc;

        }




        .menu h3 {

            color: #0b3d91;

        }





        a {

            text-decoration: none;
            color: #0b3d91;
            font-weight: bold;
            margin: 5px;

        }




        a:hover {

            color: #e67e22;

        }





        .content {

            background-color: white;
            padding: 30px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0px 3px 10px #ccc;

        }




        h2 {

            color: #0b3d91;
            text-align: center;

        }





        form {

            width: 70%;
            margin: auto;

        }





        label {

            font-weight: bold;

        }





        select {

            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;

        }





        .rating {

            margin-top: 15px;

        }





        input[type="radio"] {

            margin-left: 15px;
            margin-right: 5px;

        }





        button {

            margin-top: 20px;
            background-color: #0b3d91;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;

        }





        button:hover {

            background-color: #e67e22;

        }





        footer {

            margin-top: 30px;
            background-color: #0b3d91;
            color: white;
            text-align: center;
            padding: 15px;

        }


    </style>


</head>



<body>



<header>

    <h1>STUDENT PORTAL</h1>
    <h3>Faculty Feedback</h3>

</header>




<div class="container">



    <div class="menu">


        <h3>Menu</h3>


        <a href="index.html">Home</a> |
        <a href="registration.html">New Registration</a> |
        <a href="profile.html">Profile</a> |
        <a href="courses.html">Courses</a> |
        <a href="attendance.html">Attendance</a> |
        <a href="result.html">Result</a> |
        <a href="materials.html">Materials</a> |
        <a href="feedback.html">Feedback</a> |
        <a href="timetable.html">Time Table</a> |
        <a href="about.html">About Us</a>


    </div>





    <div class="content">


        <h2>Faculty Feedback Form</h2>



        <form>


            <p>

                <label>Select Subject:</label><br>


                <select>


                    <option>
                        Fundamentals of Computer Network
                    </option>


                    <option>
                        Fundamentals of Data Structure and Algorithms
                    </option>


                    <option>
                        Web Development Framework
                    </option>


                    <option>
                        Object-Oriented Programming
                    </option>


                </select>


            </p>





            <p class="rating">


                <label>Faculty Rating:</label><br><br>


                <input type="radio" name="rating">
                Excellent


                <input type="radio" name="rating">
                Good


                <input type="radio" name="rating">
                Average


                <input type="radio" name="rating">
                Poor


            </p>




            <button type="submit">
                Submit Feedback
            </button>



        </form>



    </div>



</div>




<footer>


    <b>Student Portal Website</b><br>

    © 2026 Student Portal. All Rights Reserved.


</footer>




</body>


</html>
